name: Lean CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Build Challenge and Solution
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "Challenge Solution"
          use-mathlib-cache: true
