# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Discontinuity of stochastic convolutions"
  description: >-
    A formalization of a corollary of Theorem 1.2 of arXiv:2609.12688v1. 
    A C0-semigroup on a separable Hilbert space can admit a stochastic 
    convolution that has no continuous modification.
  authors: ["Joris van Winden"]
  responsible_maintainers: ["Joris van Winden"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math.FA"]
  msc2020: ["60H15", "47D06", "60H05", "60G17"]

sources:
  - title: "No free lunch for continuity of stochastic convolutions"
    authors: ["Mark Veraar", "Joris van Winden"]
    id: "https://arxiv.org/abs/2609.12688v1"
    type: "paper"
    location: "Theorem 1.2"
    relationship: "adapts"
    license: "CC-BY-4.0"

status:
  scope: >-
    The main result is the construction of a semigroup and
    stochastic integrand for which the stochastic convolution
    has no continuous modification. Additionally, a characterization
    of the stochastic integral is provided. It is proved that this
    stochastic integral exists and is unique for the class of integrands 
    under consideration.
  # Counts exclude the intentional placeholders in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: StochasticConvolution.discontinuous_stochastic_convolution
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: StochasticConvolution.exists_isItoIntegral
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: StochasticConvolution.isItoIntegral_unique
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "manual"
    - method: "agent"
      framework: "OpenAI Codex"
      models: ["GPT-6 Astra"]
      cost:
        wall_time: "5 hours"
        spend_usd: "subscription: chatgpt for academic researchers"
        hardware: "Desktop PC"
  spend_usd: "subscription: chatgpt for academic researchers"
  notes: ""

fidelity:
  divergences: >-
    The statement is a corollary of Theorem 1.2 from the article:
    the semigroup is not required to be analytic, compact, or
    exponentially stable. The convolution is required to be discontinuous 
    on [0,∞) instead of unbounded on [0,1]. The formal proof uses 
    the strategy and ideas of the article, but in a more direct way 
    and with more explicit calculations.

review:
  status: "author-verified"
  reviewers: ["Joris van Winden"]
  notes: >-
    The author wrote the formal theorem statement and verified that it
    accurately captures the corollary of the article. The author verified
    that the Solution proves the statements from the Challenge using comparator.

acknowledgements: >-
  The author is grateful to the Lean and Mathlib community for developing
  the proof assistant and mathematical library, and to the Brownian motion
  project for providing the foundations needed for stochastic calculus.

  The author has received funding from the VICI subsidy VI.C.242.087
  of the Netherlands Organisation for Scientific Research (NWO).
  This work was supported in part by a grant of access to OpenAI models 
  through the ChatGPT for Academic Researchers program.