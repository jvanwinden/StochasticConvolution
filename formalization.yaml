# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Discontinuity of stochastic convolutions"
  description: >-
    A formalization of a corollary of Theorem 1.2 of Veraar and van Winden's
    No free lunch for continuity of stochastic convolutions. A C0-semigroup
    on a complex Hilbert space can admit a stochastic convolution of a
    predictable integrand with essentially bounded pathwise L2 norm that
    has no continuous modification. The development also proves existence
    and almost sure uniqueness of the Ito integral defined through
    approximation by predictable elementary integrals.
  authors: ["Joris van Winden"]
  responsible_maintainers: ["Joris van Winden"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math.FA"]
  msc2020: ["60H15", "47D06", "60H05", "60G17"]

sources:
  - title: "No free lunch for continuity of stochastic convolutions"
    authors: ["Mark Veraar", "Joris van Winden"]
    id: "https://arxiv.org/abs/2609.12688v1"
    type: "paper"
    location: "Theorem 1.2"
    relationship: "adapts"
    license: "CC-BY-4.0"

status:
  scope: >-
    Proves the three declarations in comparator.json. The main result is
    the C0-semigroup/no-continuous-modification corollary; the paper's
    stronger semigroup properties and finite-time unboundedness conclusions
    are outside the scope of the compared statement.
  # Counts exclude the intentional placeholders in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "manual"
    - method: "agent"
      framework: "OpenAI Codex"
      models: [] # TODO: Add model identifiers.
      cost:
        wall_time: "not recorded" # TODO: Fill in if known.
        spend_usd: "not recorded" # TODO: Fill in if known.

fidelity:
  divergences: >-
    Uses a harmonic triangular Schauder basis in l2 and a direct argument
    with stopped Brownian exponentials, energy stopping, and Baire category,
    in place of the paper's weighted trigonometric basis and general
    extrapolation argument.

