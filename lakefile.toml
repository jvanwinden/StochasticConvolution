name = "StochasticConvolution"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
roots = ["Solution", "StochasticConvolution"]
globs = ["Solution", "StochasticConvolution.+"]